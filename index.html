function vEq(){$("#m").innerHTML=`<div class="card"><div class="bar"><button class="p" onclick="fEq()">+ Nuevo equipo instalado</button><span class="note">Un cliente puede tener varios equipos; ligarlos a la incidencia evita recapturar datos y detecta reincidencias por equipo.</span></div><div class="tw"><table><tr><th>ID</th><th>Cliente</th><th>Modelo</th><th>Familia</th><th>Serie</th><th>Instalación</th><th>Incidencias</th><th>Reincid.</th></tr>${S.eq.map(q=>{const n=S.inc.filter(i=>i.eq===q.id),c=S.cli.find(x=>x.id===q.cli);return`<tr class="cl" onclick="fEq('${q.id}')"><td>${esc(q.id)}</td><td>${esc(c?c.nom:q.cli)}</td><td>${esc(q.mod)}</td><td>${esc(q.fam||modFam(q.mod))}</td><td>${esc(q.serie)}</td><td>${esc(q.fi)}</td><td>${n.length}</td><td>${n.filter(i=>i.rei==="Sí").length}</td></tr>`}).join("")||'<tr><td colspan=8 class="nd">Sin equipos instalados.</td></tr>'}</table></div></div>`}
function fEq(id){const x=S.eq.find(q=>q.id===id)||{id:nextId(S.eq,"EQP-",4)};
 $("#dlg").innerHTML=`<form id="f"><h2>Equipo ${x.id}</h2><div class="g"><label>ID<i>*</i><input name="id" value="${x.id}"></label><label>Cliente<i>*</i><select name="cli">${`<option value=""></option>`+S.cli.map(c=>`<option value="${esc(c.id)}" ${c.id===x.cli?"selected":""}>${esc(c.id)} · ${esc(c.nom)}</option>`).join("")}</select></label>
 <label>Modelo<i>*</i><input name="mod" list="dm" value="${esc(x.mod||"")}" autocomplete="off"><datalist id="dm">${FAMS.flatMap(f=>CAT[f]).map(m=>`<option>${esc(m)}</option>`).join("")}</datalist></label><label>Familia (si el modelo no está en el catálogo)<select name="fam">${opt(FAMS,x.fam)}</select></label>

 $("#f").onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v);
  if(!/^EQP-\d+$/.test(o.id)||!o.mod)return $("#er").textContent="Capture ID (EQP-0001) y modelo.";
  if(!S.cli.some(c=>c.id===o.cli))return $("#er").textContent="Elija un cliente registrado.";
  if(o.id!==id&&S.eq.some(q=>q.id===o.id))return $("#er").textContent="Ese ID ya existe.";
